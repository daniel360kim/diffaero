name: velocity_pointmass
abbr: pmv_yawrate

# Non-holonomic velocity-command point mass: the policy outputs
# [vx, vz, yaw_rate] in the yaw-local frame -- forward velocity, up
# velocity and a yaw-rate command. There is no lateral velocity command,
# so the forward depth camera always faces the commanded motion. The
# deploy bridge rotates [vx, 0, vz] by the measured heading and sends
# velocity + yaw-rate setpoints to PX4 offboard.
#
# Starling 2 Max: the velocity loop is plant=px4_fit, PX4 refitted on the
# real Starling USD in Isaac (superfly_expert_sampler wt/v8-chunk
# scripts/fit_px4_plant.py, 40 trials; sim_episode.py PX4_* and
# A_XY_MAX / THRUST_MIN / THRUST_MAX). The sys-ID's rigid-body numbers
# (superfly configs/vehicles/starling2max.yaml: mass, inertia, k_T, motor
# lag) are inside that fit; a velocity point mass has no rotor layer.
# Yaw rate is capped at 1 rad/s, the Starling feasibility target (not
# sys-ID). Collision radius 0.26 m (reach_3d) is env.r_drone, set by the
# superfly recipe. Cruise bands come from env.min/max_target_vel; the
# 0.5-2.0 and 2-5 m/s recipes override max_vel.x / max_vel.z
# (superfly scripts/train_diffaero_yawrate.sh). Real-vehicle ulogs should
# replace the Isaac fit when they land.

n_envs: ${n_envs}
n_agents: ${n_agents}
dt: ${env.dt}
action_frame: "local"   # vx_vz_yawrate is yaw-local by definition
action_is_velocity: True
action_space: "vx_vz_yawrate"
planar: False
m: 1.0
g: 9.81
plant: "px4_fit"        # "first_order": the pmv lag below (+ software lag at deploy)
px4_fit:                # Isaac fit +/- a band for the real airframe
  delay_steps:          # setpoint -> response delay in env steps (dt 1/30 s): fit 0.13 s
    default: 4
    enabled: True
    min: 3
    max: 5
  gain_xy:              # low-frequency horizontal gain (1.3 m/s flown for a 1.5 setpoint)
    default: 0.9
    enabled: True
    min: 0.85
    max: 0.95
  kv:                   # velocity-loop gain [1/s]: a_cmd = kv (v_sp - v)
    default: 4.0
    enabled: True
    min: 3.0
    max: 5.0
  acc_lag_s:            # first-order acceleration lag [s]
    default: 0.05
    enabled: True
    min: 0.03
    max: 0.08
  a_xy_max: 11.35       # sampler clamp_command limits [m/s^2]
  thrust_min: 2.0
  thrust_max: 15.0
lmbda:                  # plant=first_order only: velocity tracking lag [1/s]
  default: 1.2
  enabled: False
  min: 0.5
  max: 2.0
lmbda_yaw:              # yaw-rate tracking lag [1/s] after the shared delay. NOT
  default: 10.0         # fitted (the Isaac fit is velocity-only): tau ~0.1 s
  enabled: True
  min: 6.0
  max: 15.0
alpha: 1.0
align_yaw_with_target_direction: False
align_yaw_with_vel_ema: False   # yaw is commanded, not slewed
vel_ema_factor:
  default: 0.1
  enabled: True
  min: 0.08
  max: 0.12

max_vel:
  x:                    # forward clamp [m/s]: dodge headroom above cruise
    default: 2.0
    enabled: True
    min: 1.5
    max: 2.5
  z:                    # up/down clamp [m/s]
    default: 1.0
    enabled: True
    min: 0.8
    max: 1.2
  xy:                   # unused by vx_vz_yawrate; schema compat with pmv
    default: 2.0
    enabled: False
    min: 2.0
    max: 2.0
reverse_vel_x: 0.5      # vx lower bound is -reverse_vel_x (brake / back off a little)

max_yaw_rate:           # yaw-rate action clamp [deg/s]: 1 rad/s Starling target,
  default: 57.3         # never randomized above it
  enabled: True
  min: 45
  max: 57.3
yaw_hold_speed: 0.3     # unused by vx_vz_yawrate; schema compat
init_yaw_jitter_deg: 30 # uniform heading error added to the goal-facing start

solver_type: "rk4"      # unused
n_substeps: 5           # px4_fit integration substeps per env step (150 Hz, as the fit)
