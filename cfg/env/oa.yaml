name: obstacle_avoidance
abbr: oa

sensor: ${sensor}
dynamics: ${dynamics}
dt: 0.0333
length:
  default: 25
  enabled: False
  min: 25
  max: 25
height_scale: 0.25
n_envs: ${n_envs}
n_agents: ${n_agents}
obs_frame: "local" # "world" or "local"
max_time: 30
wait_before_truncate: 5.
max_target_vel: 6.
min_target_vel: 3.
last_action_in_obs: False
r_drone: 0.2
n_obstacles: 30
ground_plane: True
oob_terminates: False  # True: leaving the arena = collision (terminal, penalized), not a free truncation

loss_weights:
  pointmass:
    vel: 2
    z: 1.
    oa: 5.
    jerk: 0.01
    pos: 5.
    collision: 0.
    yaw_rate: 0.05  # vx_vz_yawrate only: penalty on the yaw-rate command [rad/s]^2
    heading: 1.     # vx_vz_yawrate only: 1 - cos(yaw - bearing to goal)
  quadrotor:
    vel: 2.
    oa: 5.
    jerk: 0.02   # jerk_loss = |body_rate|; keep small so the policy can still rotate to translate/avoid
    pos: 5.
    collision: 0.

reward_weights:
  # for Reinforcement Learning
  # constant: 1.
  # pointmass:
  #   vel: 0.06
  #   z: 0.2
  #   oa: 0.6
  #   jerk: 0.0005
  #   pos: 0.5
  #   arrive: 0.
  #   collision: 5.

  # for SHA2C
  constant: 2
  pointmass:
    vel: 0.
    z: 0.
    oa: 0.
    jerk: 0.001
    pos: 0.
    arrive: 1.
    collision: 50.
    yaw_rate: 0.01  # vx_vz_yawrate only
    heading: 0.     # vx_vz_yawrate only
  quadrotor:
    vel: 1.
    oa: 1.
    jerk: 1.
    pos: 5.
    collision: 50.

# Observation noise on what the policy sees (never the loss or the critic).
# Placeholder magnitudes until fitted from PX4 ulogs; see superfly
# docs/DIFFAERO_YAWRATE.md for the ulog topic each field comes from.
obs_noise:
  enabled: False
  vel_std: 0.05        # white noise on the velocity estimate [m/s], per axis
  vel_bias_std: 0.02   # per-episode constant velocity bias [m/s]
  yaw_rate_std: 0.02   # white noise on the yaw-rate estimate [rad/s]
  pos_std: 0.05        # white noise on the position estimate (goal vector) [m]
  pos_bias_std: 0.10   # per-episode constant position bias [m]
  depth_std_rel: 0.02  # multiplicative range noise, fraction of the range
  depth_dropout: 0.01  # probability a depth pixel has no return (reads far)

enable_grid: False
defaults:
  - render: oa_render
  - randomizer: default_randomizer
  - imu: default_imu
  - obstacles: outdoor
  - _self_
